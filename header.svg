<svg viewBox="0 0 810 210" xmlns="http://www.w3.org/2000/svg"
     style="width: 100%; border-radius: 12px; background: rgb(255, 255, 255);">

  <defs>

    <!-- Main name gradient -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>

    <!-- Background waves -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0"/>
    </linearGradient>

  </defs>

  <!-- White background -->
  <rect
    width="800"
    height="200"
    fill="#ffffff"
  />

  <!-- Decorative dot pattern -->
  <g opacity="0.10">

    <circle cx="40" cy="20" r="1" fill="#2563eb"/>
    <circle cx="120" cy="20" r="1" fill="#2563eb"/>
    <circle cx="200" cy="20" r="1" fill="#2563eb"/>
    <circle cx="280" cy="20" r="1" fill="#2563eb"/>
    <circle cx="360" cy="20" r="1" fill="#2563eb"/>
    <circle cx="440" cy="20" r="1" fill="#2563eb"/>
    <circle cx="520" cy="20" r="1" fill="#2563eb"/>
    <circle cx="600" cy="20" r="1" fill="#2563eb"/>
    <circle cx="680" cy="20" r="1" fill="#2563eb"/>
    <circle cx="760" cy="20" r="1" fill="#2563eb"/>

    <circle cx="40" cy="60" r="1" fill="#2563eb"/>
    <circle cx="120" cy="60" r="1" fill="#2563eb"/>
    <circle cx="680" cy="60" r="1" fill="#2563eb"/>
    <circle cx="760" cy="60" r="1" fill="#2563eb"/>

    <circle cx="40" cy="100" r="1" fill="#2563eb"/>
    <circle cx="760" cy="100" r="1" fill="#2563eb"/>

    <circle cx="40" cy="140" r="1" fill="#2563eb"/>
    <circle cx="760" cy="140" r="1" fill="#2563eb"/>

    <circle cx="40" cy="180" r="1" fill="#2563eb"/>
    <circle cx="120" cy="180" r="1" fill="#2563eb"/>
    <circle cx="200" cy="180" r="1" fill="#2563eb"/>
    <circle cx="280" cy="180" r="1" fill="#2563eb"/>
    <circle cx="360" cy="180" r="1" fill="#2563eb"/>
    <circle cx="440" cy="180" r="1" fill="#2563eb"/>
    <circle cx="520" cy="180" r="1" fill="#2563eb"/>
    <circle cx="600" cy="180" r="1" fill="#2563eb"/>
    <circle cx="680" cy="180" r="1" fill="#2563eb"/>
    <circle cx="760" cy="180" r="1" fill="#2563eb"/>

  </g>

  <!-- Decorative background waves -->
  <path
    d="M0,140 C200,100 400,160 600,120 C700,100 750,140 800,120 L800,200 L0,200 Z"
    fill="url(#waveGrad3)"
  />

  <path
    d="M0,150 C200,110 400,170 600,130 C700,110 750,150 800,130 L800,200 L0,200 Z"
    fill="url(#waveGrad2)"
  />

  <path
    d="M0,160 C200,120 400,180 600,140 C700,120 750,160 800,140 L800,200 L0,200 Z"
    fill="url(#waveGrad1)"
  />

  <!-- Decorative particles -->
  <g>
    <circle cx="680" cy="50" r="3" fill="#2563eb" opacity="0.4"/>
    <circle cx="720" cy="80" r="2" fill="#7c3aed" opacity="0.4"/>
    <circle cx="650" cy="100" r="2" fill="#22c55e" opacity="0.4"/>
    <circle cx="700" cy="30" r="2" fill="#2563eb" opacity="0.4"/>
    <circle cx="740" cy="110" r="3" fill="#7c3aed" opacity="0.4"/>
  </g>

  <!-- Name -->
  <text
    x="400"
    y="82"
    text-anchor="middle"
    font-family="monospace"
    font-size="36"
    font-weight="700"
    fill="url(#grad1)">
    Kimia Ghassemloo
  </text>

  <!-- Subtitle -->

  <!-- Location -->
  <text
    x="400"
    y="186"
    text-anchor="middle"
    font-family="monospace"
    font-size="11"
    fill="#64748b">
    📍 Tehran
  </text>

</svg>
